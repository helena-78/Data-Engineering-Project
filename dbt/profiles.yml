# All connection settings come from environment variables (set in .env / docker-compose.yml).
# Locally: export the same variables and run `dbt debug --profiles-dir dbt --project-dir dbt`.
observatory:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      # Fallback database for models without a +schema config (tests, ad-hoc models).
      schema: "{{ env_var('DBT_DEFAULT_SCHEMA', 'gold') }}"
      secure: false
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      connect_timeout: 10
      send_receive_timeout: 600
