# Estonian Company Performance Observatory: ClickHouse + Airflow (LocalExecutor) + dbt.
#
#   cp .env.example .env            # then edit passwords / keys
#   docker compose up -d --build    # ClickHouse, Postgres, Airflow (UI on http://localhost:8080)
#   docker compose run --rm dbt build          # ad-hoc dbt (profile "tools"; any dbt command works)
#   docker compose run --rm dbt debug
#
# All credentials and container paths come from .env; nothing secret is written in this file.
# Host folders mounted into Airflow: ./airflow/dags, ./dbt, ./scripts, ./data, ./clickhouse/init, ./sql.

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # schedule=None DAGs only run when triggered, so they can start unpaused (TriggerDagRunOperator
  # runs would otherwise wait in "queued" until someone unpauses dbt_refresh_gold).
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
  # ClickHouse connection for dbt (dbt/profiles.yml) and for scripts/load_bronze.py
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  # Paths inside the containers
  DBT_PROJECT_DIR: ${DBT_PROJECT_DIR}
  DBT_PROFILES_DIR: ${DBT_PROFILES_DIR}
  DBT_TARGET: ${DBT_TARGET:-dev}
  DATA_DIR: ${DATA_DIR}
  SCRIPTS_DIR: ${SCRIPTS_DIR}
  CLICKHOUSE_INIT_DIR: ${CLICKHOUSE_INIT_DIR}
  # RIK source file settings (file names change monthly)
  RIK_FILE_VERSION: ${RIK_FILE_VERSION}
  RIK_YEARS: ${RIK_YEARS}

x-airflow-common: &airflow-common
  build:
    context: .                      # repo root: the image bakes in dbt/packages.yml (see .dockerignore)
    dockerfile: airflow/Dockerfile
  image: observatory-airflow:2.10.5
  environment:
    <<: *airflow-env
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./dbt:${DBT_PROJECT_DIR}
    - ./scripts:${SCRIPTS_DIR}
    - ./data:${DATA_DIR}
    - ./clickhouse/init:${CLICKHOUSE_INIT_DIR}:ro
    - ./sql:/opt/airflow/sql:ro      # analytical queries Q1 to Q5, run after dbt_test (run_queries task)
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy
    clickhouse:
      condition: service_healthy

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8   # LTS line; tested with 26.8.37.168
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT_HOST:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT_HOST:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # *.sql here run once, on first start with an empty data volume (databases + bronze tables)
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT_HOST:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Ad-hoc dbt runs outside Airflow: docker compose run --rm dbt <dbt command>
  dbt:
    image: observatory-airflow:2.10.5
    build:
      context: .
      dockerfile: airflow/Dockerfile
    profiles: ["tools"]
    entrypoint: ["/opt/dbt-venv/bin/dbt"]
    command: ["build"]
    working_dir: ${DBT_PROJECT_DIR}
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      DBT_PROJECT_DIR: ${DBT_PROJECT_DIR}
      DBT_PROFILES_DIR: ${DBT_PROFILES_DIR}
      DBT_TARGET: ${DBT_TARGET:-dev}
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    volumes:
      - ./dbt:${DBT_PROJECT_DIR}
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
  postgres-data:
  airflow-logs:
